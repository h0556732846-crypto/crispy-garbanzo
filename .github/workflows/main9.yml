
name: Check Disk Space Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check disk space
        run: |
          echo "=========================================="
          echo "DISK SPACE"
          echo "=========================================="

          df -h /

          echo ""
          echo "=========================================="
          echo "FREE SPACE"
          echo "=========================================="

          df -BG / | tail -1

          echo ""
          echo "=========================================="
          echo "CHECK COMPLETE"
          echo "=========================================="
