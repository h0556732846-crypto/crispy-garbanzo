```yaml
name: Check Disk Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check disk space
        run: |
          echo "=========================================="
          echo "DISK SPACE"
          echo "=========================================="

          df -h /

          echo ""
          echo "=========================================="
          echo "FREE SPACE"
          echo "=========================================="

          df -BG / | tail -1

          echo ""
          echo "=========================================="
          echo "DISK USAGE BY MAIN DIRECTORIES"
          echo "=========================================="

          sudo du -xhd1 / 2>/dev/null | sort -h

          echo ""
          echo "=========================================="
          echo "CHECK COMPLETE"
          echo "=========================================="
```
