name: Check Disk Space

on:
  workflow_dispatch:

jobs:
  check-space:
    runs-on: ubuntu-latest

    steps:
      - name: Check disk space
        run: |
          echo "=========================================="
          echo "DISK SPACE"
          echo "=========================================="
          df -h /

          echo ""
          echo "=========================================="
          echo "FREE SPACE"
          echo "=========================================="

          df -BG / | awk 'NR==2 {
            print "Total: " $2
            print "Used:  " $3
            print "Free:  " $4
            print "Usage: " $5
          }'
