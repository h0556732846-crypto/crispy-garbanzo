name: Download Charles APPX to Private Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download APPX
        env:
          DOWNLOAD_URL: "https://www.charlesproxy.com/assets/release/5.2.2/charles-proxy-5.2.2-win-x86_64.appx?k=7a4b1c8dec"
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "$DOWNLOAD_URL" \
            -o charles-proxy-5.2.2-win-x86_64.appx

          test -s charles-proxy-5.2.2-win-x86_64.appx
          file charles-proxy-5.2.2-win-x86_64.appx

      - name: Create Private Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release create charles-5.2.2 \
            charles-proxy-5.2.2-win-x86_64.appx \
            --repo "$REPO" \
            --title "Charles Proxy 5.2.2" \
            --notes "Downloaded from the official Charles website." \
            --latest=false
