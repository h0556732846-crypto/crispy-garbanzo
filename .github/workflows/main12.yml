name: Lightweight Remote Browser

on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install browser
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            wget \
            curl

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Start virtual display
        run: |
          Xvfb :99 \
            -screen 0 1366x768x24 \
            -ac \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

          echo "Virtual display started."

      - name: Start Chromium
        run: |
          export DISPLAY=:99

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --start-maximized \
            --no-first-run \
            --no-default-browser-check \
            about:blank \
            > /tmp/chromium.log 2>&1 &

          sleep 8

          echo "Chromium started."

      - name: Start VNC
        run: |
          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -nopw \
            -listen 127.0.0.1 \
            -rfbport 5900 \
            > /tmp/x11vnc.log 2>&1 &

          sleep 3

          echo "VNC started."

      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc/ \
            6080 \
            127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 &

          sleep 3

          echo "noVNC started."

      - name: Install Cloudflare Tunnel
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version

      - name: Create browser link
        run: |
          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflare.log 2>&1 &

          echo "Waiting for public URL..."

          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflare.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo ""
              echo "=========================================="
              echo " BROWSER URL"
              echo "=========================================="
              echo "$URL/vnc.html"
              echo "=========================================="
              echo ""
              break
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Cloudflare URL was not created."
            cat /tmp/cloudflare.log
            exit 1
          fi

      - name: Keep browser alive
        run: |
          echo "Browser is running."

          while true; do
            sleep 60
          done
