
name: Create 7z Split Parts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full gh

      - name: Find existing downloaded file
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR EXISTING FILE"
          echo "=========================================="

          mkdir -p parts

          echo "📂 Current files:"
          find parts -type f -printf '%s bytes  %p\n' | sort -nr || true

          FILE=$(find parts -type f -size +100M -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$FILE" ]; then
            echo "❌ No existing downloaded file found"
            echo "Nothing will be downloaded."
            exit 1
          fi

          echo "✅ Existing file found:"
          echo "$FILE"

          echo "💾 Disk space:"
          df -h .

          echo "=========================================="
          echo "CREATING 1GB 7z PARTS"
          echo "=========================================="

          7z a \
            -v1g \
            -mx=0 \
            -mmt=2 \
            parts/archive.7z "$FILE"

          echo "🗑️ Removing original file..."
          rm -f "$FILE"

          echo "=========================================="
          echo "CREATED PARTS"
          echo "=========================================="

          ls -lh parts/archive.7z.*

          echo "💾 Remaining disk space:"
          df -h .

      - name: Create Release
        run: |
          gh release create "run-${{ github.run_id }}" \
            --title "Run ${{ github.run_id }}" \
            --notes "Existing file split into 1GB 7z parts"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Parts
        run: |
          set -e

          cd parts

          for FILE in archive.7z.*; do
            echo "📤 Uploading $FILE"

            gh release upload \
              "run-${{ github.run_id }}" \
              "$FILE" \
              --clobber
          done

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
