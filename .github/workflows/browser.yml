name: Remote Chrome Browser

on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Update system
        run: |
          sudo apt-get update

      - name: Install desktop and VNC
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            tigervnc-standalone-server \
            novnc \
            websockify \
            chromium \
            dbus-x11 \
            wget \
            curl \
            unzip

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Configure VNC
        run: |
          mkdir -p ~/.vnc

          cat > ~/.vnc/xstartup <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          xrdb "$HOME/.Xresources" 2>/dev/null || true

          startxfce4 &
          EOF

          chmod +x ~/.vnc/xstartup

          # Generate random VNC password
          PASS=$(openssl rand -base64 12 | tr -dc 'A-Za-z0-9' | head -c 8)

          echo "$PASS" > ~/vnc-password.txt

          printf '%s\n' "$PASS" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          echo "VNC PASSWORD:"
          cat ~/vnc-password.txt

      - name: Start virtual desktop
        run: |
          vncserver :1 \
            -geometry 1366x768 \
            -depth 24 \
            -localhost

          sleep 5

          echo "Desktop started."

      - name: Start Chromium
        run: |
          export DISPLAY=:1

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --start-maximized \
            --no-first-run \
            --no-default-browser-check \
            about:blank > /tmp/chromium.log 2>&1 &

          sleep 8

          echo "Chromium started."

      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc/ \
            6080 \
            localhost:5901 \
            > /tmp/novnc.log 2>&1 &

          sleep 5

          echo "noVNC started on port 6080."

      - name: Install Cloudflare Tunnel
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version

      - name: Create public browser link
        run: |
          echo ""
          echo "=============================================="
          echo " STARTING PUBLIC BROWSER CONNECTION"
          echo "=============================================="
          echo ""

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            2>&1 | tee /tmp/cloudflare.log &

          echo "Waiting for Cloudflare URL..."

          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflare.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo ""
              echo "=============================================="
              echo " YOUR BROWSER URL:"
              echo "$URL/vnc.html"
              echo "=============================================="
              echo ""
              break
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Could not find Cloudflare URL."
            cat /tmp/cloudflare.log
            exit 1
          fi

      - name: Keep browser alive
        run: |
          echo ""
          echo "=============================================="
          echo " BROWSER IS READY"
          echo "=============================================="
          echo ""
          echo "Keep this workflow running."
          echo "Open the URL shown above."
          echo ""

          while true; do
            sleep 60
          done
